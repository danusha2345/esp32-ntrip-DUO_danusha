name: Build and Release ESP32 Firmware

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create release'
        required: true
        default: true
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.4.4
    strategy:
      matrix:
        target: [esp32, esp32c3, esp32s3, esp32c6]
        include:
          - target: esp32
            board_name: "ESP32"
            flash_size: "4MB"
            flash_freq: "40m"
            bootloader_offset: "0x1000"
          - target: esp32c3
            board_name: "ESP32-C3"
            flash_size: "4MB"
            flash_freq: "40m"
            bootloader_offset: "0x0"
          - target: esp32s3
            board_name: "ESP32-S3"
            flash_size: "8MB"
            flash_freq: "40m"
            bootloader_offset: "0x0"
          - target: esp32c6
            board_name: "ESP32-C6"
            flash_size: "4MB"
            flash_freq: "80m"
            bootloader_offset: "0x0"
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Configure and build firmware
      run: |
        . /opt/esp/idf/export.sh
        
        # Clean any existing build directory
        if [ -d "build/" ]; then
          echo "Cleaning existing build directory..."
          chmod -R 755 build/ 2>/dev/null || true
          rm -rf build/ || {
            echo "Warning: Could not remove build directory completely. Trying alternative cleanup..."
            sudo rm -rf build/ 2>/dev/null || {
              find build/ -type f -exec sudo chmod 644 {} \; 2>/dev/null || true
              find build/ -type d -exec sudo chmod 755 {} \; 2>/dev/null || true
              sudo rm -rf build/* 2>/dev/null || true
            }
          }
        fi
        
        # Set target
        echo "Setting target to ${{ matrix.target }}"
        idf.py set-target ${{ matrix.target }}
        
        # Copy target-specific sdkconfig if exists
        if [ -f "sdkconfig.${{ matrix.target }}" ]; then
          echo "Using target-specific configuration for ${{ matrix.target }}"
          cp "sdkconfig.${{ matrix.target }}" sdkconfig
        fi
        
        # Build and generate merged firmware
        idf.py build
        
        # Generate merged firmware (single file containing all partitions)
        echo "Generating merged firmware..."
        idf.py merge-bin --format raw --output ${{ matrix.target }}-merged.bin
        
    - name: Create firmware package
      run: |
        mkdir -p release/${{ matrix.target }}
        cp build/bootloader/bootloader.bin release/${{ matrix.target }}/
        cp build/partition_table/partition-table.bin release/${{ matrix.target }}/
        cp build/*.bin release/${{ matrix.target }}/
        cp build/*.elf release/${{ matrix.target }}/
        
        # Copy merged firmware
        if [ -f "build/${{ matrix.target }}-merged.bin" ]; then
          echo "Copying merged firmware..."
          cp build/${{ matrix.target }}-merged.bin release/${{ matrix.target }}/${{ matrix.target }}-ntrip-duo-merged.bin
        fi
        
        # Создаем flash_download_tool конфигурацию
        cat > release/${{ matrix.target }}/download.conf << 'EOF'
        # ESP32 NTRIP DUO Flash Configuration for ${{ matrix.board_name }}
        # Use with ESP32 Flash Download Tool or esptool.py
        
        # Flash command:
        # python -m esptool --chip ${{ matrix.target }} -b 460800 --before default_reset --after hard_reset write_flash --flash_mode dio --flash_size ${{ matrix.flash_size }} --flash_freq ${{ matrix.flash_freq }} ${{ matrix.bootloader_offset }} bootloader.bin 0x8000 partition-table.bin 0x10000 ${{ matrix.target }}-ntrip-duo.bin 0x210000 www.bin
        
        ${{ matrix.bootloader_offset }}=bootloader.bin
        0x8000=partition-table.bin
        0x10000=${{ matrix.target }}-ntrip-duo.bin
        0x210000=www.bin
        EOF
        
        # Создаем README с инструкциями
        cat > release/${{ matrix.target }}/README.md << 'EOF'
        # ESP32 NTRIP DUO - ${{ matrix.board_name }} Firmware
        
        ## Files Description
        - `bootloader.bin` - ESP32 bootloader
        - `partition-table.bin` - Partition table
        - `${{ matrix.target }}-ntrip-duo.bin` - Main application firmware
        - `www.bin` - Web interface files
        - `${{ matrix.target }}-ntrip-duo.elf` - ELF file for debugging
        - `${{ matrix.target }}-ntrip-duo-merged.bin` - Complete firmware (all-in-one file)
        - `download.conf` - Flash configuration for ESP32 Flash Download Tool
        
        ## Flash Instructions
        
        ### Using ESP32 Flash Download Tool
        1. Download and install [ESP32 Flash Download Tool](https://www.espressif.com/en/support/download/other-tools)
        2. Load the `download.conf` configuration
        3. Set flash parameters: DIO mode, ${{ matrix.flash_size }}, ${{ matrix.flash_freq }}
        4. Connect your ${{ matrix.board_name }} and flash
        
        ### Using esptool.py (Individual Files)
        ```bash
        pip install esptool
        
        python -m esptool --chip ${{ matrix.target }} -p COM_PORT -b 460800 --before default_reset --after hard_reset write_flash --flash_mode dio --flash_size ${{ matrix.flash_size }} --flash_freq ${{ matrix.flash_freq }} ${{ matrix.bootloader_offset }} bootloader.bin 0x8000 partition-table.bin 0x10000 ${{ matrix.target }}-ntrip-duo.bin 0x210000 www.bin
        ```
        
        ### Using esptool.py (Merged Firmware - Recommended)
        ```bash
        pip install esptool
        
        python -m esptool --chip ${{ matrix.target }} -p COM_PORT -b 460800 --before default_reset --after hard_reset write_flash 0x0 ${{ matrix.target }}-ntrip-duo-merged.bin
        ```
        
        ### Using ESP-IDF
        ```bash
        idf.py -p COM_PORT flash
        ```
        
        ## Hardware Configuration
        
        ### ${{ matrix.board_name }} Pin Mapping
        **Status LEDs:**
        EOF
        
        # Добавляем специфичные для чипа пины
        if [ "${{ matrix.target }}" = "esp32" ]; then
          cat >> release/${{ matrix.target }}/README.md << 'EOF'
        - Red LED: GPIO 21
        - Green LED: GPIO 22  
        - Blue LED: GPIO 23
        - RSSI LED: GPIO 18
        - Sleep LED: GPIO 27
        - Assoc LED: GPIO 25
        
        **UART2 (Default):**
        - TX: GPIO 17
        - RX: GPIO 16
        - RTS: GPIO 32
        - CTS: GPIO 33

        **SD card defaults:** MISO=GPIO2, MOSI=GPIO15, CLK=GPIO14, CS=GPIO13

        GPIO1/GPIO3 share the USB-UART bridge. ESP32-WROVER boards must remap
        GPIO16/GPIO17 because those pins are normally used by PSRAM.
        
        **Button:** GPIO 0
        EOF
        elif [ "${{ matrix.target }}" = "esp32c3" ]; then
          cat >> release/${{ matrix.target }}/README.md << 'EOF'
        - Red LED: GPIO 8
        - Green LED: GPIO 9
        - Blue LED: GPIO 10
        - RSSI LED: GPIO 2
        - Sleep LED: GPIO 3
        - Assoc LED: GPIO 4
        
        **UART0 (Default):**
        - TX: GPIO 21
        - RX: GPIO 20
        - RTS: GPIO 5
        - CTS: GPIO 6

        **SD card defaults:** MISO=GPIO7, MOSI=GPIO15, CLK=GPIO14, CS=GPIO13
        
        **Button:** GPIO 0
        EOF
        elif [ "${{ matrix.target }}" = "esp32s3" ]; then
          cat >> release/${{ matrix.target }}/README.md << 'EOF'
        - Red LED: GPIO 4
        - Green LED: GPIO 5
        - Blue LED: GPIO 6
        - RSSI LED: GPIO 18
        - Sleep LED: GPIO 21
        - Assoc LED: GPIO 47
        
        **UART0 (Default):**
        - TX: GPIO 43
        - RX: GPIO 44
        - RTS: GPIO 16
        - CTS: GPIO 17

        **SD card defaults:** MISO=GPIO2, MOSI=GPIO15, CLK=GPIO14, CS=GPIO13
        
        **Button:** GPIO 0
        EOF
        elif [ "${{ matrix.target }}" = "esp32c6" ]; then
          cat >> release/${{ matrix.target }}/README.md << 'EOF'
        - Red LED: GPIO 4
        - Green LED: GPIO 5
        - Blue LED: GPIO 6
        - RSSI LED: GPIO 18
        - Sleep LED: GPIO 19
        - Assoc LED: GPIO 20
        
        **UART0 (Default):**
        - TX: GPIO 16
        - RX: GPIO 17
        - RTS: GPIO 22
        - CTS: GPIO 23

        **SD card defaults:** MISO=GPIO2, MOSI=GPIO15, CLK=GPIO14, CS=GPIO13
        
        **Button:** GPIO 9
        EOF
        fi
        
        cat >> release/${{ matrix.target }}/README.md << 'EOF'
        
        ## Features
        - Dual NTRIP server support
        - NTRIP client functionality  
        - Serial Commands for GNSS configuration
        - SD Card logging with daily RTCM rotation
        - Web-based configuration interface
        - WiFi AP and STA modes
        - Status LED indicators
        
        ## First Time Setup
        1. Flash the firmware
        2. Connect to the open ntrip-DUO_danusha WiFi network
        3. Open browser and navigate to http://192.168.4.1
        4. Configure your WiFi and NTRIP settings

        UART settings stored in NVS survive an update. Change them in the web
        interface or erase NVS to apply new defaults.
        EOF
        
    - name: Create archive
      run: |
        cd release
        tar -czf esp32-ntrip-duo-${{ matrix.target }}-$(date +%Y%m%d).tar.gz ${{ matrix.target }}/
        
    - name: Upload firmware artifacts
      uses: actions/upload-artifact@v4
      with:
        name: firmware-${{ matrix.target }}
        path: release/${{ matrix.target }}/
        
    - name: Upload archive artifacts
      uses: actions/upload-artifact@v4
      with:
        name: archive-${{ matrix.target }}
        path: release/*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release)
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts/
        
    - name: Prepare release files
      run: |
        mkdir -p release_files
        
        # Копируем архивы
        find artifacts -name "*.tar.gz" -exec cp {} release_files/ \;
        
        # Создаем общий README
        cat > release_files/README.md << 'EOF'
        # ESP32 NTRIP DUO - Firmware Release
        
        Pre-compiled firmware for ESP32, ESP32-C3, ESP32-S3, and ESP32-C6.
        
        ## Available Targets
        - `esp32-ntrip-duo-esp32-*.tar.gz`
        - `esp32-ntrip-duo-esp32c3-*.tar.gz`
        - `esp32-ntrip-duo-esp32s3-*.tar.gz`
        - `esp32-ntrip-duo-esp32c6-*.tar.gz`
        
        ## What's New
        - ESP32-WROOM defaults moved from the shared USB-UART pins to UART2: TX=GPIO17, RX=GPIO16.
        - ESP32-C3 SD MISO moved to GPIO7 to avoid the RSSI LED on GPIO2.
        - Missing and invalid web configuration requests are handled safely.
        - Socket startup failure cleanup and persistent socket-client LED behaviour are fixed.
        - Target-specific bootloader offsets and flash frequencies are used in individual-file commands.
        - Pinout, security defaults, and ESP-IDF 5.4.4 build instructions are synchronized.
        
        ## Quick Start
        1. Download the appropriate .tar.gz file for your ESP32 variant
        2. Extract the archive
        3. Flash `<target>-ntrip-duo-merged.bin` at offset `0x0`
        4. Connect to the open `ntrip-DUO_danusha` WiFi network (no password)
        5. Configure via web interface at http://192.168.4.1
        
        ## Support
        - Issues: https://github.com/danusha2345/esp32-ntrip-DUO_danusha/issues
        EOF
        
        # Показываем что у нас получилось
        ls -la release_files/
        
    - name: Get version
      id: version
      run: |
        if [[ $GITHUB_REF == refs/tags/* ]]; then
          echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        else
          echo "version=v$(date +%Y.%m.%d)" >> $GITHUB_OUTPUT
        fi
        
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.version.outputs.version }}
        name: ESP32 NTRIP DUO ${{ steps.version.outputs.version }}
        body: |
          ## ESP32 NTRIP DUO Firmware Release ${{ steps.version.outputs.version }}
          
          ### Fixes and improvements
          - ESP32-WROOM now defaults to UART2: TX=GPIO17 and RX=GPIO16, avoiding the USB-UART bridge on GPIO1/GPIO3.
          - ESP32-C3 SD MISO now defaults to GPIO7, avoiding the RSSI LED on GPIO2.
          - Web authentication and configuration validation error paths are fixed.
          - Socket startup cleanup and persistent socket-client LED behaviour are fixed.
          - Individual-file flash commands use the correct target-specific bootloader offset and flash frequency.
          - README and archive pin maps now match the firmware defaults.
          
          ### 📦 Downloads
          Choose the appropriate firmware for your hardware:
          
          - **esp32-ntrip-duo-esp32-*.tar.gz** - For original ESP32 boards
          - **esp32-ntrip-duo-esp32c3-*.tar.gz** - For ESP32-C3 boards
          - **esp32-ntrip-duo-esp32s3-*.tar.gz** - For ESP32-S3 boards
          - **esp32-ntrip-duo-esp32c6-*.tar.gz** - For ESP32-C6 boards
          
          ### Quick flash (merged firmware recommended)
          ```bash
          # Extract archive and navigate to folder
          tar -xzf esp32-ntrip-duo-esp32-*.tar.gz
          cd esp32/
          
          # Flash merged firmware (single file, replace COM_PORT with your port)
          python -m esptool --chip esp32 -p COM_PORT -b 460800 --before default_reset --after hard_reset write_flash 0x0 esp32-ntrip-duo-merged.bin
          ```
          
          ### First-time setup
          1. Flash appropriate firmware for your ESP32 variant
          2. Connect to the open **ntrip-DUO_danusha** WiFi network (no password)
          3. Navigate to http://192.168.4.1 in your browser
          4. Configure WiFi, NTRIP servers, and other settings
          
          Existing devices retain UART settings stored in NVS. Select the new pins in the web interface or erase NVS to apply defaults.
        files: release_files/*
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
